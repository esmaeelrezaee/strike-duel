<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STRIKE DUEL</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e16;color:white;font-family:Tahoma,Arial;overflow:hidden;touch-action:none}canvas{display:block}#menu{position:absolute;inset:0;background:linear-gradient(145deg,#091622ee,#101d32ee);z-index:10;display:grid;place-items:center}#panel{width:min(90vw,420px);background:#142337;border:1px solid #50718c;border-radius:18px;padding:30px;text-align:center;box-shadow:0 20px 90px #000b}h1{font-size:35px;letter-spacing:5px;color:#7ce2ff;margin:0 0 8px}p{line-height:1.8;color:#b9cbd8}input,button{font:inherit;border-radius:10px;padding:13px;border:1px solid #6687a5}input{background:#081525;color:#fff;width:100%;text-align:center;letter-spacing:3px}button{background:#1f90b7;color:white;font-weight:bold;cursor:pointer}#start{width:100%;margin-top:12px}#hud{position:absolute;inset:0;pointer-events:none;display:none}#top{position:absolute;top:15px;right:15px;background:#06101bbb;padding:12px 18px;border-radius:8px;font-size:15px}#stats{position:absolute;bottom:22px;right:20px;font-size:22px;font-weight:bold;text-shadow:0 2px 4px black}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;color:#e5faff;text-shadow:0 0 6px black}#status{position:absolute;top:18px;left:20px;background:#06101bbb;padding:10px;border-radius:8px}#mobile{display:none;position:absolute;inset:0;pointer-events:none}#stick{position:absolute;bottom:30px;left:25px;width:125px;height:125px;border:2px solid #ffffff77;border-radius:50%;background:#ffffff15;pointer-events:auto}#knob{position:absolute;width:52px;height:52px;border-radius:50%;background:#7ce2ff99;left:35px;top:35px}#fire,#reload{position:absolute;right:25px;bottom:55px;width:95px;height:95px;border-radius:50%;pointer-events:auto;background:#b83243c9}#reload{right:42px;bottom:168px;width:65px;height:65px;background:#336b91c9;font-size:12px}#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;color:#ddd;text-shadow:0 1px 3px black}#message{position:absolute;top:28%;width:100%;text-align:center;font-size:25px;font-weight:bold;text-shadow:0 2px 8px black;pointer-events:none}</style></head><body><div id="menu"><div id="panel"><h1>STRIKE DUEL</h1><p>دوئل آنلاین سه‌بعدی دو نفره<br>یک نفر اتاق بسازد، کد را برای دوستش بفرستد.</p><input id="room" maxlength="6" placeholder="کد اتاق (خالی = ساخت اتاق)"><button id="start">ورود به بازی</button><p id="err" style="color:#ff9999"></p><p style="font-size:12px">کامپیوتر: WASD، ماوس، کلیک، R<br>موبایل: جوی‌استیک چپ، نگاه با لمس سمت راست</p></div></div><div id="hud"><div id="top">اتاق: <b id="code">—</b> | <span id="players">منتظر حریف...</span></div><div id="status">امتیاز: <span id="score">0 - 0</span></div><div id="cross">+</div><div id="stats">❤️ <span id="hp">100</span> &nbsp; 🔫 <span id="ammo">30</span>/30</div><div id="message"></div><div id="hint">برای قفل شدن ماوس روی بازی کلیک کنید</div><div id="mobile"><div id="stick"><div id="knob"></div></div><button id="fire">شلیک</button><button id="reload">خشاب</button></div></div><script type="module" src="/game.js"></script></body></html>
